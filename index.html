<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>مشتريات المطبخ</title>
<style>
:root{--bg:#f5f2ea;--card:#fff;--ink:#17211b;--muted:#6c746f;--accent:#2f6d4f;--line:#e2ded4;--danger:#b73b3b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--ink);touch-action:manipulation}button,input,select{font:inherit}
header{position:sticky;top:0;z-index:10;background:#f5f2eaf5;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
h1{font-size:23px;margin:0;flex:1}.btn{border:0;border-radius:14px;padding:11px 14px;font-size:15px;font-weight:800;background:#fff;box-shadow:0 1px 5px #0001}.primary{background:var(--accent);color:#fff}.danger{background:#fff0f0;color:var(--danger)}.badge{background:#d84343;color:#fff;border-radius:999px;padding:2px 8px;margin-right:5px}
main{padding:16px;max-width:1250px;margin:auto}.quicksearch{display:flex;gap:8px;margin-bottom:12px}.quicksearch input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px 16px;font-size:18px}.clearSearch{border:0;background:#fff;border-radius:14px;width:48px;font-size:22px}.searchMeta{font-size:14px;color:var(--muted);margin:-4px 2px 10px}
.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:999px;font-weight:800}.cat.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}.product{position:relative;background:var(--card);border:2px solid transparent;border-radius:20px;overflow:hidden;box-shadow:0 4px 15px #0000000d;min-height:200px}.product.selected{border-color:var(--accent);background:#eef7f1}.productMain{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit}.product img{width:100%;height:140px;object-fit:cover;background:#eee;display:block;pointer-events:none}.pname{font-size:18px;font-weight:900;padding:10px 8px 13px;text-align:center;line-height:1.3}.plus{position:absolute;left:8px;top:8px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:26px;box-shadow:0 2px 8px #0003;z-index:3;pointer-events:none}.selected .plus{background:var(--accent);color:#fff}.qty{position:absolute;right:8px;top:8px;background:#111c;color:#fff;padding:7px 10px;border-radius:999px;font-weight:800;z-index:3}.edit{position:absolute;right:8px;bottom:52px;z-index:5;width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0002;font-size:20px}
.panel{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow:auto}.panel.open{display:block}.panelbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}.panelbar h2{flex:1;margin:0;font-size:22px}.list{padding:16px;display:grid;gap:10px;max-width:900px;margin:auto}.row{background:#fff;border-radius:18px;padding:10px;display:grid;grid-template-columns:82px 1fr auto;gap:12px;align-items:center}.row img{width:82px;height:72px;object-fit:cover;border-radius:13px}.controls{display:flex;gap:7px}.controls button{width:42px;height:42px;border:0;border-radius:12px;font-size:21px}
.form{max-width:720px;margin:18px auto;padding:18px;background:#fff;border-radius:22px}.form label{display:block;font-weight:900;margin:14px 0 6px}.form input,.form select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font-size:17px}.preview{width:180px;height:135px;object-fit:cover;border-radius:15px;background:#eee;margin-top:10px}.formrow{display:grid;grid-template-columns:1fr auto;gap:8px}.searchResults{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:9px;margin-top:10px}.imgChoice{border:2px solid transparent;border-radius:14px;overflow:hidden;background:#eee;padding:0}.imgChoice img{width:100%;height:105px;object-fit:cover;display:block}.imgChoice.chosen{border-color:var(--accent)}.status{padding:10px;border-radius:12px;background:#f2f4f2;color:#455;margin-top:8px;display:none}.status.show{display:block}.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:20px}
#idle{position:fixed;inset:0;z-index:100;display:none;background:#111 center/cover no-repeat;color:#fff;align-items:center;justify-content:center;text-align:center}.shade{position:absolute;inset:0;background:#0005}.clockbox{position:relative;text-shadow:0 3px 18px #000;font-weight:700}.clock{font-size:clamp(72px,15vw,170px)}.date{font-size:clamp(22px,4vw,42px);margin-top:18px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}.row{grid-template-columns:65px 1fr}.controls{grid-column:2}.formrow{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6d4f">
<meta name="apple-mobile-web-app-capable" content="yes">

</head><body>
<header><h1>🛒 مشتريات المطبخ</h1><button class="btn" id="backupBtn">نسخ احتياطي</button><button class="btn" id="restoreBtn">استعادة</button><input id="restoreFile" type="file" accept="application/json" style="display:none"><button class="btn" id="addBtn">＋ إضافة</button><button class="btn primary" id="cartBtn">القائمة <span class="badge" id="count">0</span></button></header>
<main><div class="quicksearch"><input id="productSearch" type="search" placeholder="🔎 ابحث عن منتج…"><button class="clearSearch" id="clearProductSearch">×</button></div><div class="searchMeta" id="searchMeta"></div><div class="cats" id="cats"></div><div class="grid" id="grid"></div></main>
<section class="panel" id="cart"><div class="panelbar"><h2>قائمة المشتريات</h2><button class="btn" id="shareBtn">مشاركة</button><button class="btn backBtn" data-panel="cart">رجوع</button></div><div class="list" id="cartList"></div></section>
<section class="panel" id="editor"><div class="panelbar"><h2 id="editorTitle">إضافة منتج</h2><button class="btn backBtn" data-panel="editor">رجوع</button></div><div class="form"><label>اسم المنتج</label><input id="editName"><label>التصنيف</label><select id="editCat"></select><label>أو تصنيف جديد</label><input id="customCat"><label>الصورة الحالية</label><br><img class="preview" id="preview"><label>إضافة صورة من الجهاز</label><input type="file" id="imageFile" accept="image/*"><hr><label>🔎 البحث عن صورة من الإنترنت</label><div class="formrow"><input id="imageSearch"><button class="btn primary" id="imageSearchBtn">بحث</button></div><div id="searchStatus" class="status"></div><div class="searchResults" id="searchResults"></div><p style="display:flex;gap:8px"><button class="btn primary" id="saveBtn" style="flex:1">حفظ</button><button class="btn danger" id="deleteBtn">حذف المنتج</button></p></div></section>
<div id="idle"><div class="shade"></div><div class="clockbox"><div class="clock" id="clock"></div><div class="date" id="date"></div><div style="margin-top:25px">المس الشاشة للعودة</div></div></div>
<script>
const svg=(emoji,bg='#ece7dc')=>'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400"><rect width="100%" height="100%" fill="${bg}"/><text x="50%" y="58%" text-anchor="middle" font-size="170">${emoji}</text></svg>`);
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return h}
const real=q=>`https://loremflickr.com/480/360/${encodeURIComponent(q)}?lock=${Math.abs(hash(q))%99991}`;
const catalog=[
// أساسيات وتوابل
['سكر','أساسيات وتوابل','sugar'],['ملح','أساسيات وتوابل','salt'],['قهوة سعودية','قهوة وشاي','arabic coffee'],['هيل','أساسيات وتوابل','cardamom'],['اريغانو','أساسيات وتوابل','oregano'],['كركم','أساسيات وتوابل','turmeric'],['بهارات','أساسيات وتوابل','spices'],['دبس رمان','صلصات وإضافات','pomegranate molasses'],['فلفل اسود','أساسيات وتوابل','black pepper'],['ورق غار','أساسيات وتوابل','bay leaves'],['نعناع مطحون','أساسيات وتوابل','dried mint'],['زنجبيل مطحون','أساسيات وتوابل','ground ginger'],['ثوم مطحون','أساسيات وتوابل','garlic powder'],['بهارات شاورما','أساسيات وتوابل','shawarma spice'],['سكر دايت','أساسيات وتوابل','sweetener'],['ماجي','أساسيات وتوابل','bouillon cube'],
// خضار وفواكه
['خس','خضار وفواكه','lettuce'],['ليمون','خضار وفواكه','lemon'],['خيار','خضار وفواكه','cucumber'],['برتقال','خضار وفواكه','orange'],['تفاح','خضار وفواكه','apple'],['بطيخ','خضار وفواكه','watermelon'],['عنب','خضار وفواكه','grapes'],['جرجير','خضار وفواكه','arugula'],['فلفل اخضر','خضار وفواكه','green pepper'],
// ألبان وأجبان
['كريمة طبخ','ألبان وأجبان','cooking cream'],['جبة سايله كرافت','ألبان وأجبان','Kraft cheese'],['جبنة سايلة مراعي','ألبان وأجبان','liquid cheese'],['جبنة مربعات','ألبان وأجبان','cheese portions'],['لبنه','ألبان وأجبان','labneh'],['موزلريلا','ألبان وأجبان','mozzarella'],['لبن','ألبان وأجبان','laban yogurt drink'],['زبادي','ألبان وأجبان','yogurt'],['زبادي يوناني','ألبان وأجبان','greek yogurt'],['قشطة تاج','ألبان وأجبان','cream can'],['قشطة بوك','ألبان وأجبان','Puck cream'],['جبنة زيت','ألبان وأجبان','cheese olive oil'],
// مخبوزات ودقيق
['توست','خبز ومخبوزات','toast bread'],['خبز ابيض','خبز ومخبوزات','white bread'],['خبز بر','خبز ومخبوزات','whole wheat bread'],['صامولي','خبز ومخبوزات','bread roll'],['تورتيلا','خبز ومخبوزات','tortilla'],['طحين كويتي','دقيق ومخبوزات','flour bag'],['طحيب ابيض','دقيق ومخبوزات','white flour'],['طحين بر','دقيق ومخبوزات','whole wheat flour'],

['صلصة بيتزا','صلصات وإضافات','pizza sauce'],['صلصة كتشب','صلصات وإضافات','ketchup'],['خل','صلصات وإضافات','vinegar'],['تونة','معلبات','tuna can'],['فول','معلبات','fava beans can'],['حمص','معلبات','hummus'],['زيتون اسود','معلبات','black olives'],['زيتون اخضر','معلبات','green olives'],['زيتون مقطع اسود','معلبات','sliced black olives'],['زيتون مقطع اخضر','معلبات','sliced green olives'],['رانش','صلصات وإضافات','ranch dressing'],['باربيكيو','صلصات وإضافات','barbecue sauce'],['صلصلة جبنة','صلصات وإضافات','cheese sauce'],['عصير ليمون','صلصات وإضافات','lemon juice bottle'],
// قهوة وشاي
['شاهي ابو جبل','قهوة وشاي','tea box'],['شاهي كبوس','قهوة وشاي','Kabous tea'],['قهوة تركية','قهوة وشاي','turkish coffee'],
// مشروبات
['عصير الربيع','مشروبات','Al Rabie juice'],['عصير فواكة مشكة الربيع','مشروبات','mixed fruit juice'],['بيبسي دايت صغير','مشروبات','diet pepsi can'],['بيبسي دايت كبير','مشروبات','diet pepsi bottle'],['كولا دايت صغير','مشروبات','diet coke can'],['كولا دايت كبير','مشروبات','diet coke bottle'],['كينزا','مشروبات','Kinza soda'],['بيرة تفاح اخضر','مشروبات','green apple malt drink'],
// لحوم ومجمدات
['دجاج صدور','لحوم ومجمدات','chicken breast'],['دجاج كامل','لحوم ومجمدات','whole chicken'],['لحم مفروم','لحوم ومجمدات','ground beef'],['دجاج مفروم','لحوم ومجمدات','ground chicken'],['ناجت','لحوم ومجمدات','chicken nuggets'],['نقانق','لحوم ومجمدات','sausages'],['برغر لحم','لحوم ومجمدات','beef burger'],['برغر دجاج','لحوم ومجمدات','chicken burger'],['كباب لحم','لحوم ومجمدات','beef kebab'],
// حلويات وسناك
['تمر','حلويات وسناك','dates'],['كيك','حلويات وسناك','cake'],['كرييكرز','حلويات وسناك','crackers'],['فشار زبدة مايكرويف','حلويات وسناك','microwave butter popcorn'],
// تنظيف
['داوني','تنظيف وغسيل','Downy fabric softener'],['فيري','تنظيف وغسيل','Fairy dish soap'],['كروليكس','تنظيف وغسيل','cleaning product'],['صابون يد','تنظيف وغسيل','hand soap'],['منظف ارضيات','تنظيف وغسيل','floor cleaner'],['صابون بودة غسيل ملابس','تنظيف وغسيل','laundry detergent powder'],['سفنجة','تنظيف وغسيل','cleaning sponge']
];
const defaults=catalog.map((x,i)=>({id:'c'+i,name:x[0],cat:x[1],img:real(x[2]),search:x[2]}));
function getJSON(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}function setJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let products=getJSON('ks_products_v3',null)||defaults.slice();let cart=getJSON('ks_cart_v3',{});let current='الكل',query='',editingId=null,chosenImg='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fallback(el){el.onerror=null;el.src=svg('🛍️')}
function categories(){return ['الكل',...new Set(products.map(p=>p.cat).filter(Boolean))]}
function saveAll(){setJSON('ks_products_v3',products);setJSON('ks_cart_v3',cart);render()}
function render(){
 const cats=document.getElementById('cats');cats.replaceChildren();categories().forEach(c=>{const b=document.createElement('button');b.className='cat'+(c===current?' on':'');b.textContent=c;b.dataset.cat=c;cats.appendChild(b)});
 const q=query.trim().toLowerCase();const filtered=products.filter(p=>(current==='الكل'||p.cat===current)&&(!q||(p.name+' '+p.cat+' '+(p.search||'')).toLowerCase().includes(q)));
 document.getElementById('searchMeta').textContent=q?`تم العثور على ${filtered.length} منتج`:'';
 const grid=document.getElementById('grid');grid.replaceChildren();
 if(!filtered.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">لا توجد منتجات مطابقة</div>'}
 filtered.forEach(p=>{const card=document.createElement('div');card.className='product'+(cart[p.id]?' selected':'');card.innerHTML=`<button class="productMain" data-add="${esc(p.id)}"><img alt="${esc(p.name)}"><div class="pname">${esc(p.name)}</div></button><span class="plus">${cart[p.id]?'✓':'+'}</span>${cart[p.id]>1?`<span class="qty">×${cart[p.id]}</span>`:''}<button class="edit" data-edit="${esc(p.id)}">✏️</button>`;const im=card.querySelector('img');im.onerror=()=>fallback(im);im.src=p.img||svg('🛍️');grid.appendChild(card)});
 document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+Number(b||0),0);
}
function renderCart(){const box=document.getElementById('cartList');box.replaceChildren();const ids=Object.keys(cart);if(!ids.length){box.innerHTML='<div class="empty">لا توجد مشتريات حالياً</div>';return}ids.forEach(id=>{const p=products.find(x=>x.id===id);if(!p)return;const r=document.createElement('div');r.className='row';r.innerHTML=`<img><div><h3>${esc(p.name)}</h3><div>الكمية: ${cart[id]}</div></div><div class="controls"><button data-change="1" data-id="${esc(id)}">＋</button><button data-change="-1" data-id="${esc(id)}">−</button><button data-remove="${esc(id)}">×</button></div>`;const im=r.querySelector('img');im.onerror=()=>fallback(im);im.src=p.img||svg('🛍️');box.appendChild(r)})}
function openEditor(id=null){editingId=id;const p=id?products.find(x=>x.id===id):null;document.getElementById('editorTitle').textContent=p?'تعديل المنتج':'إضافة منتج';document.getElementById('editName').value=p?.name||'';document.getElementById('customCat').value='';const sel=document.getElementById('editCat');sel.replaceChildren();categories().filter(x=>x!=='الكل').forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;if(p&&p.cat===c)o.selected=true;sel.appendChild(o)});chosenImg=p?.img||svg('🛍️');document.getElementById('preview').src=chosenImg;document.getElementById('imageSearch').value=p?.name||'';document.getElementById('searchResults').replaceChildren();document.getElementById('searchStatus').className='status';document.getElementById('deleteBtn').style.display=p?'inline-block':'none';document.getElementById('editor').classList.add('open')}
async function searchImages(){const q=(document.getElementById('imageSearch').value||document.getElementById('editName').value).trim();if(!q)return alert('اكتب اسم المنتج');const st=document.getElementById('searchStatus'),box=document.getElementById('searchResults');st.className='status show';st.textContent='جاري البحث…';box.replaceChildren();try{const u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=12&gsrsearch='+encodeURIComponent(q)+'&prop=imageinfo&iiprop=url&iiurlwidth=500&format=json&origin=*';const r=await fetch(u);const d=await r.json();const pages=Object.values(d.query?.pages||{}).filter(p=>p.imageinfo?.[0]);if(!pages.length)throw new Error();st.textContent='اختر الصورة:';pages.forEach(p=>{const url=p.imageinfo[0].thumburl||p.imageinfo[0].url;const b=document.createElement('button');b.className='imgChoice';b.dataset.url=url;const im=document.createElement('img');im.src=url;b.appendChild(im);box.appendChild(b)})}catch(e){st.textContent='تعذر البحث. يمكنك إضافة الصورة من الجهاز.'}}

document.getElementById('cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;current=b.dataset.cat;render();resetIdle()});
document.getElementById('grid').addEventListener('click',e=>{const ed=e.target.closest('[data-edit]');if(ed){openEditor(ed.dataset.edit);resetIdle();return}const ad=e.target.closest('[data-add]');if(ad){cart[ad.dataset.add]=(cart[ad.dataset.add]||0)+1;saveAll();resetIdle()}});
document.getElementById('cartList').addEventListener('click',e=>{const ch=e.target.closest('[data-change]');if(ch){const id=ch.dataset.id;cart[id]=(cart[id]||0)+Number(ch.dataset.change);if(cart[id]<=0)delete cart[id];saveAll();renderCart();return}const rm=e.target.closest('[data-remove]');if(rm){delete cart[rm.dataset.remove];saveAll();renderCart()}});
document.getElementById('addBtn').addEventListener('click',()=>openEditor());document.getElementById('cartBtn').addEventListener('click',()=>{document.getElementById('cart').classList.add('open');renderCart()});document.querySelectorAll('.backBtn').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.panel).classList.remove('open')));
document.getElementById('productSearch').addEventListener('input',e=>{query=e.target.value;render();resetIdle()});document.getElementById('clearProductSearch').addEventListener('click',()=>{query='';document.getElementById('productSearch').value='';render()});
document.getElementById('imageSearchBtn').addEventListener('click',searchImages);document.getElementById('searchResults').addEventListener('click',e=>{const b=e.target.closest('[data-url]');if(!b)return;chosenImg=b.dataset.url;document.getElementById('preview').src=chosenImg;document.querySelectorAll('.imgChoice').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen')});
document.getElementById('imageFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{chosenImg=r.result;document.getElementById('preview').src=chosenImg};r.readAsDataURL(f)});
document.getElementById('saveBtn').addEventListener('click',()=>{const name=document.getElementById('editName').value.trim();if(!name)return alert('اكتب اسم المنتج');const cat=document.getElementById('customCat').value.trim()||document.getElementById('editCat').value||'أخرى';if(editingId){const p=products.find(x=>x.id===editingId);if(p){p.name=name;p.cat=cat;p.img=chosenImg}}else products.push({id:'u'+Date.now(),name,cat,img:chosenImg||svg('🛍️')});saveAll();document.getElementById('editor').classList.remove('open')});
document.getElementById('deleteBtn').addEventListener('click',()=>{if(!editingId)return;const p=products.find(x=>x.id===editingId);if(p&&confirm('حذف «'+p.name+'»؟')){products=products.filter(x=>x.id!==editingId);delete cart[editingId];saveAll();document.getElementById('editor').classList.remove('open')}});
document.getElementById('shareBtn').addEventListener('click',async()=>{const text='قائمة المشتريات:\n'+Object.keys(cart).map(id=>{const p=products.find(x=>x.id===id);return p?'• '+p.name+' × '+cart[id]:''}).filter(Boolean).join('\n');try{if(navigator.share)await navigator.share({title:'قائمة المشتريات',text});else alert(text)}catch(e){}});
const backgrounds=['https://picsum.photos/seed/kitchen1/1600/1000','https://picsum.photos/seed/kitchen2/1600/1000','https://picsum.photos/seed/nature3/1600/1000'];let idleTimer,bgTimer;function updateClock(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}function setBg(){document.getElementById('idle').style.backgroundImage=`url('${backgrounds[Math.floor(Math.random()*backgrounds.length)]}')`}function showIdle(){if(document.querySelector('.panel.open'))return resetIdle();updateClock();setBg();document.getElementById('idle').style.display='flex';bgTimer=setInterval(setBg,300000)}function hideIdle(){document.getElementById('idle').style.display='none';clearInterval(bgTimer);resetIdle()}function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(showIdle,120000)}document.getElementById('idle').addEventListener('click',hideIdle);document.addEventListener('pointerdown',e=>{if(e.target.id!=='idle')resetIdle()},{passive:true});setInterval(updateClock,1000);

// نسخة احتياطية واستعادة — مفيدة عند الانتقال بين الأجهزة
function exportBackup(){
  const data={version:3,exportedAt:new Date().toISOString(),products,cart};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kitchen-shopping-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importBackup(file){
  const r=new FileReader();r.onload=()=>{try{
    const d=JSON.parse(r.result);if(!Array.isArray(d.products)||typeof d.cart!=='object')throw new Error();
    products=d.products;cart=d.cart||{};saveAll();alert('تمت استعادة البيانات بنجاح');
  }catch(e){alert('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(file);
}
document.getElementById('backupBtn').addEventListener('click',exportBackup);
document.getElementById('restoreBtn').addEventListener('click',()=>document.getElementById('restoreFile').click());
document.getElementById('restoreFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)importBackup(f);e.target.value=''});

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();resetIdle();
</script></body></html>
